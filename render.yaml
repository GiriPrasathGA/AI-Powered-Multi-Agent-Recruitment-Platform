services:
  - type: web
    name: agenthire-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: NEXUS_API_BASE_URL
        value: https://api.openai.com/v1
      - key: NEXUS_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/agenthire.db
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma_store
